<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tes Aplikasi</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px; font-size: 18px; background-color: #3ECF8E; color: white; border: none; border-radius: 5px; width: 100%; }
        #hasil { margin-top: 20px; font-size: 20px; font-weight: bold; color: red; }
    </style>
</head>
<body>

    <h2>Halaman Tes</h2>
    <form id="form-tes">
        <input type="text" placeholder="Ketik apa saja" style="padding:10px; width:100%; margin-bottom:10px;">
        <button type="submit">Klik Saya</button>
    </form>

    <div id="hasil">Belum diklik</div>

    <script>
        // Skrip paling sederhana untuk mengetes apakah JavaScript berjalan
        document.getElementById('form-tes').addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman refresh
            document.getElementById('hasil').innerText = "BERHASIL! JavaScript berjalan.";
            document.getElementById('hasil').style.color = "green";
        });
    </script>

</body>
</html>
