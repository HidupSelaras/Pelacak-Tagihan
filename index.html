<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelacak Tagihan</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #3ECF8E; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        button:hover { background-color: #2ea874; }
        .error { color: red; font-size: 13px; text-align: center; margin-top: 10px; font-weight: bold;}
    </style>
</head>
<body>

<div class="card">
    <h2>Masuk</h2>
    <div id="error-msg" class="error"></div>

    <form id="auth-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Kata Sandi" required>
        <button type="submit" id="submit-btn">Masuk</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // PASTIKAN URL DAN KEY DI BAWAH INI SUDAH BENAR
    const SUPABASE_URL = 'https://jetxgfzlzitprejjiiep.supabase.co';
    const SUPABASE_KEY = 'ISI_DENGAN_PUBLISHABLE_KEY_ANDA_LENGKAP'; 

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    const authForm = document.getElementById('auth-form');
    const errorMsg = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.innerText = 'Memproses...';
        errorMsg.style.color = 'blue';
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            errorMsg.innerText = "Error: " + error.message;
            errorMsg.style.color = 'red';
            submitBtn.innerText = 'Masuk';
        } else {
            errorMsg.innerText = 'Login Berhasil!';
            errorMsg.style.color = 'green';
            alert("Selamat datang!");
        }
    });
</script>
</body>
</html>
